<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PC Club{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #050508;
            --dark: #0a0a12;
            --dark-2: #0f0f1a;
            --dark-3: #141428;
            --blue: #1a56ff;
            --blue-light: #4d7fff;
            --blue-glow: rgba(26, 86, 255, 0.4);
            --blue-dim: rgba(26, 86, 255, 0.15);
            --text: #e8eaf6;
            --text-dim: #7986a8;
            --border: rgba(26, 86, 255, 0.2);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--black);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Фоновая сетка */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(26, 86, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(26, 86, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        /* Синее свечение сверху */
        body::after {
            content: '';
            position: fixed;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 400px;
            background: radial-gradient(ellipse, rgba(26, 86, 255, 0.12) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* Шапка */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 0 40px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(5, 5, 8, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-family: 'Rajdhani', sans-serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text);
            text-decoration: none;
        }

        .logo span {
            color: var(--blue);
        }

        nav a {
            font-family: 'Rajdhani', sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-dim);
            text-decoration: none;
            margin-left: 32px;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--blue-light);
        }

        /* Основной контент */
        main {
            position: relative;
            z-index: 1;
            min-height: calc(100vh - 64px);
        }

        /* Кнопки */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--blue);
            color: #fff;
            clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
        }

        .btn-primary:hover {
            background: var(--blue-light);
            box-shadow: 0 0 24px var(--blue-glow);
        }

        .btn-outline {
            background: transparent;
            color: var(--blue-light);
            border: 1px solid var(--blue);
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
        }

        .btn-outline:hover {
            background: var(--blue-dim);
            box-shadow: 0 0 16px var(--blue-glow);
        }

        /* Карточки */
        .card {
            background: var(--dark-2);
            border: 1px solid var(--border);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            border-color: rgba(26, 86, 255, 0.5);
            box-shadow: 0 0 30px rgba(26, 86, 255, 0.1);
        }

        /* Бейдж типа зоны */
        .badge {
            display: inline-block;
            padding: 3px 10px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .badge-standard { background: rgba(100, 116, 139, 0.2); color: #94a3b8; border: 1px solid rgba(100,116,139,0.3); }
        .badge-vip { background: rgba(234, 179, 8, 0.1); color: #eab308; border: 1px solid rgba(234,179,8,0.3); }
        .badge-bootcamp { background: rgba(26, 86, 255, 0.15); color: var(--blue-light); border: 1px solid var(--border); }

        /* Разделитель */
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--blue), transparent);
            margin: 40px 0;
        }

        /* Подписи / метки */
        .label {
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--blue-light);
        }

        /* Анимация появления */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-up {
            animation: fadeUp 0.5s ease forwards;
        }

        /* Футер */
        footer {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 32px;
            border-top: 1px solid var(--border);
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .detail-wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 60px 40px;
    }

    /*club_detail*/
    /* Шапка клуба */
    .club-header {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 60px;
        align-items: start;
        margin-bottom: 80px;
        animation: fadeUp 0.5s ease forwards;
    }

    .club-header-info .label {
        display: block;
        margin-bottom: 16px;
    }

    .club-header-info h1 {
        font-family: 'Rajdhani', sans-serif;
        font-size: clamp(36px, 5vw, 60px);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: -1px;
        line-height: 1;
        margin-bottom: 16px;
    }

    .club-header-info .address {
        font-family: 'Share Tech Mono', monospace;
        font-size: 13px;
        color: var(--text-dim);
        letter-spacing: 1px;
        margin-bottom: 24px;
    }

    .club-header-info .description {
        font-size: 15px;
        color: var(--text-dim);
        line-height: 1.8;
        margin-bottom: 32px;
    }

    /* Галерея фото клуба */
    .club-gallery {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
    }

    .club-gallery img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        filter: brightness(0.8) saturate(0.8);
        transition: filter 0.3s;
    }

    .club-gallery img:first-child {
        grid-column: 1 / -1;
        height: 260px;
    }

    .club-gallery img:hover {
        filter: brightness(1) saturate(1);
    }

    /* Блок зон */
    .section-title {
        font-family: 'Rajdhani', sans-serif;
        font-size: 32px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 8px;
    }

    .section-subtitle {
        font-size: 14px;
        color: var(--text-dim);
        margin-bottom: 40px;
    }

    .zones-list {
        display: flex;
        flex-direction: column;
        gap: 24px;
    }

    /* Карточка зоны */
    .zone-card {
        background: var(--dark-2);
        border: 1px solid var(--border);
        overflow: hidden;
        animation: fadeUp 0.5s ease forwards;
        animation-delay: calc(var(--i) * 0.1s);
        opacity: 0;
        transition: border-color 0.3s;
    }

    .zone-card:hover {
        border-color: rgba(26, 86, 255, 0.5);
    }

    .zone-card-inner {
        display: grid;
        grid-template-columns: 280px 1fr;
    }

    /* Галерея зоны */
    .zone-images {
        position: relative;
        overflow: hidden;
    }

    .zone-images img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: brightness(0.75) saturate(0.8);
        transition: filter 0.3s, transform 0.4s;
        min-height: 200px;
    }

    .zone-card:hover .zone-images img {
        filter: brightness(0.9) saturate(1);
        transform: scale(1.04);
    }

    .zone-images-placeholder {
        width: 100%;
        height: 100%;
        min-height: 200px;
        background: var(--dark-3);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Share Tech Mono', monospace;
        font-size: 11px;
        color: var(--text-dim);
        letter-spacing: 2px;
    }

    /* Контент зоны */
    .zone-content {
        padding: 28px 32px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .zone-top {
        margin-bottom: 20px;
    }

    .zone-name-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
    }

    .zone-name {
        font-family: 'Rajdhani', sans-serif;
        font-size: 22px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .zone-desc {
        font-size: 14px;
        color: var(--text-dim);
        line-height: 1.7;
    }

    /* Тарифы */
    .tariffs-label {
        font-family: 'Share Tech Mono', monospace;
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--blue-light);
        margin-bottom: 12px;
    }

    .tariffs-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 20px;
    }

    .tariff-item {
        background: var(--dark-3);
        border: 1px solid var(--border);
        padding: 8px 16px;
        font-family: 'Share Tech Mono', monospace;
        font-size: 12px;
        color: var(--text);
        letter-spacing: 0.5px;
    }

    .tariff-item span {
        color: var(--blue-light);
        margin-left: 8px;
    }

    /* Кнопка выбора места */
    .zone-action {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-top: 20px;
        border-top: 1px solid var(--border);
    }

    .seats-count {
        font-family: 'Share Tech Mono', monospace;
        font-size: 12px;
        color: var(--text-dim);
        letter-spacing: 1px;
    }

    /* Кнопка назад */
    .back-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: 'Rajdhani', sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--text-dim);
        text-decoration: none;
        margin-bottom: 48px;
        transition: color 0.2s;
    }

    .back-link:hover {
        color: var(--blue-light);
    }

    @media (max-width: 768px) {
        .club-header {
            grid-template-columns: 1fr;
        }

        .zone-card-inner {
            grid-template-columns: 1fr;
        }

        .zone-images img {
            height: 200px;
        }
    }

    /*select_seat*/
    .seat-wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 60px 40px;
    }

    /* Кнопка назад */
    .back-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: 'Rajdhani', sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--text-dim);
        text-decoration: none;
        margin-bottom: 48px;
        transition: color 0.2s;
    }

    .back-link:hover {
        color: var(--blue-light);
    }

    /* Шапка зоны */
    .zone-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 48px;
        animation: fadeUp 0.5s ease forwards;
    }

    .zone-header-left .label {
        display: block;
        margin-bottom: 12px;
    }

    .zone-header-left h1 {
        font-family: 'Rajdhani', sans-serif;
        font-size: clamp(32px, 5vw, 52px);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: -1px;
        line-height: 1;
        margin-bottom: 12px;
    }

    .zone-header-left .zone-desc {
        font-size: 14px;
        color: var(--text-dim);
        line-height: 1.7;
        max-width: 400px;
    }

    /* Тарифы в шапке */
    .zone-tariffs {
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: flex-end;
    }

    .zone-tariffs .tariffs-label {
        font-family: 'Share Tech Mono', monospace;
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--blue-light);
        margin-bottom: 4px;
        text-align: right;
    }

    .tariff-item {
        background: var(--dark-2);
        border: 1px solid var(--border);
        padding: 10px 20px;
        font-family: 'Share Tech Mono', monospace;
        font-size: 13px;
        color: var(--text);
        letter-spacing: 0.5px;
        text-align: right;
    }

    .tariff-item span {
        color: var(--blue-light);
        margin-left: 12px;
    }

    .divider {
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--blue), transparent);
        margin: 40px 0;
    }

    /* Легенда */
    .legend {
        display: flex;
        align-items: center;
        gap: 24px;
        margin-bottom: 40px;
        animation: fadeUp 0.5s ease forwards;
        animation-delay: 0.1s;
        opacity: 0;
        justify-content: center;
    }

    .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: 'Share Tech Mono', monospace;
        font-size: 12px;
        letter-spacing: 1px;
        color: var(--text-dim);
    }

    .legend-dot {
        width: 20px;
        height: 20px;
        border: 1px solid;
    }

    .legend-dot.free { background: var(--dark-3); border-color: var(--border); }
    .legend-dot.inactive { background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.3); }

    /* Экран — декоративный элемент */
    .screen {
        width: 60%;
        margin: 0 auto 48px;
        text-align: center;
        animation: fadeUp 0.5s ease forwards;
        animation-delay: 0.15s;
        opacity: 0;
    }

    .screen-line {
        height: 3px;
        background: linear-gradient(90deg, transparent, var(--blue-light), transparent);
        margin-bottom: 8px;
    }

    .screen-label {
        font-family: 'Share Tech Mono', monospace;
        font-size: 11px;
        letter-spacing: 3px;
        color: var(--text-dim);
    }

    /* Схема мест */
    .seats-layout {
    display: flex;
    flex-direction: row;
    justify-content: center;
    gap: 60px;
    align-items: flex-start;
    }

    .seat-row {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .row-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1px;
    margin-bottom: 4px;
    }

    .seats {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    .seat-column {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    }

    /* Само место */
    .seat {
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Share Tech Mono', monospace;
        font-size: 12px;
        letter-spacing: 0.5px;
        cursor: pointer;
        border: 1px solid;
        transition: all 0.2s;
        text-decoration: none;
        position: relative;
    }

    /* Свободное место */
    .seat.free {
        background: var(--dark-3);
        border-color: var(--border);
        color: var(--text-dim);
    }

    .seat.free:hover {
        background: var(--blue-dim);
        border-color: var(--blue);
        color: var(--text);
        box-shadow: 0 0 16px var(--blue-glow);
        transform: translateY(-2px);
    }

    /* Недоступное место */
    .seat.inactive {
        background: rgba(239, 68, 68, 0.08);
        border-color: rgba(239, 68, 68, 0.25);
        color: rgba(239, 68, 68, 0.4);
        cursor: not-allowed;
    }

    /*index.html*/
    .index-wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 80px 40px;
    }

    .index-header {
        margin-bottom: 64px;
        animation: fadeUp 0.5s ease forwards;
    }

    .index-header .label {
        display: block;
        margin-bottom: 16px;
    }

    .index-header h1 {
        font-family: 'Rajdhani', sans-serif;
        font-size: clamp(40px, 6vw, 72px);
        font-weight: 700;
        line-height: 1;
        letter-spacing: -1px;
        text-transform: uppercase;
    }

    .index-header h1 span {
        color: var(--blue);
    }

    .index-header p {
        margin-top: 20px;
        font-size: 16px;
        color: var(--text-dim);
        max-width: 400px;
        line-height: 1.7;
    }

    /* Сетка клубов */
    .clubs-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: 24px;
    }

    .club-card {
        display: block;
        text-decoration: none;
        color: inherit;
        position: relative;
        overflow: hidden;
        animation: fadeUp 0.5s ease forwards;
        animation-delay: calc(var(--i) * 0.1s);
        opacity: 0;
    }

    .club-card-image {
        width: 100%;
        height: 220px;
        object-fit: cover;
        display: block;
        filter: brightness(0.7) saturate(0.8);
        transition: filter 0.4s, transform 0.4s;
    }

    /* Если нет картинки — заглушка */
    .club-card-image-placeholder {
        width: 100%;
        height: 220px;
        background: var(--dark-3);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Share Tech Mono', monospace;
        font-size: 12px;
        color: var(--text-dim);
        letter-spacing: 2px;
        border-bottom: 1px solid var(--border);
    }

    .club-card:hover .club-card-image {
        filter: brightness(0.9) saturate(1);
        transform: scale(1.03);
    }

    .club-card-body {
        padding: 24px;
        background: var(--dark-2);
        border: 1px solid var(--border);
        border-top: none;
        transition: border-color 0.3s;
    }

    .club-card:hover .club-card-body {
        border-color: rgba(26, 86, 255, 0.5);
    }

    .club-card-name {
        font-family: 'Rajdhani', sans-serif;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 8px;
    }

    .club-card-address {
        font-family: 'Share Tech Mono', monospace;
        font-size: 12px;
        color: var(--text-dim);
        letter-spacing: 1px;
        margin-bottom: 16px;
    }

    .club-card-desc {
        font-size: 14px;
        color: var(--text-dim);
        line-height: 1.7;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    .club-card-footer {
        margin-top: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .club-card-zones {
        font-family: 'Share Tech Mono', monospace;
        font-size: 11px;
        color: var(--blue-light);
        letter-spacing: 1px;
    }

    .arrow {
        color: var(--blue);
        font-size: 20px;
        transition: transform 0.2s;
    }

    .club-card:hover .arrow {
        transform: translateX(6px);
    }

    /* Если клубов нет */
    .empty-state {
        text-align: center;
        padding: 100px 20px;
        color: var(--text-dim);
        font-family: 'Share Tech Mono', monospace;
        font-size: 14px;
        letter-spacing: 2px;
    }
    
    .tariff-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
    }

    .tariff-hours {
        font-family: 'Share Tech Mono', monospace;
        font-size: 12px;
        color: var(--text-dim);
        letter-spacing: 1px;
    }

    .tariff-price {
        font-family: 'Share Tech Mono', monospace;
        font-size: 13px;
        color: var(--blue-light);
        letter-spacing: 1px;
    }

    .zone-gallery {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    max-width: 400px;
    }

    .zone-gallery img {
        width: 100%;
        height: 150px;
        object-fit: cover;
        filter: brightness(0.8) saturate(0.8);
        transition: filter 0.3s;
    }

    .zone-gallery img:first-child {
        grid-column: 1 / -1;
        height: 200px;
    }

    .zone-gallery img:hover {
        filter: brightness(1) saturate(1);
    }
    </style>
    {% block extra_css %}{% endblock %}
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body>

    <header>
        <a href="{% url 'club:index' %}" class="logo">PC<span>.</span>CLUB</a>
        <nav>
